name: RDP Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  # only allowed to read source code (ref. https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs)
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # Install both .NET SDKs and their runtimes
    - name: Install .NET SDKs and runtimes
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    # Build
    - name: Build solution
      run: dotnet build -c Release src/RoyalApps.Community.Rdp.slnx
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Test .NET 10
      run: dotnet test --no-build -c Release -f net10.0-windows src/RoyalApps.Community.Rdp.WinForms.Tests/RoyalApps.Community.Rdp.WinForms.Tests.csproj

    - name: Test .NET 11
      run: dotnet test --no-build -c Release -f net11.0-windows src/RoyalApps.Community.Rdp.WinForms.Tests/RoyalApps.Community.Rdp.WinForms.Tests.csproj

    # Pack nuget package
    - name: dotnet pack
      run: dotnet pack --no-build -c Release src/RoyalApps.Community.Rdp.WinForms/RoyalApps.Community.Rdp.WinForms.csproj -o .
      env:
        Configuration: ${{ matrix.configuration }}

    # Upload packages
    - name: Upload managed components
      uses: actions/upload-artifact@v7
      with:
        name: Rdp-nupkg
        path: ./*.nupkg

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Validate NuGet trusted publishing configuration
      shell: pwsh
      env:
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
          throw "Set the NUGET_USER Actions variable to the nuget.org username that created the trusted publishing policy."
        }

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Download package
      uses: actions/download-artifact@v7
      with:
        name: Rdp-nupkg
        path: packages

    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish package
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem -LiteralPath packages -Filter *.nupkg -File)
        if ($packages.Count -eq 0) {
          throw "No NuGet packages were found in the downloaded packages directory."
        }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
